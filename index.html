<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaiku Cards</title>
<style>
:root{
  --bg:#0d1117; --bg-soft:#11161d; --panel:#161b22;
  --card:#1c2128; --card-hi:#242c36;
  --bundle:#151c2b; --bundle-edge:#2b3650;
  --border:#2a313a; --border-hi:#3d4757;
  --text:#e6edf3; --muted:#8b949e; --faint:#6e7681;
  --accent:#58a6ff; --accent-soft:rgba(88,166,255,.14); --accent-ring:rgba(88,166,255,.55);
  --good:#3fb950; --danger:#f85149;
  --r:14px; --r-lg:20px;
  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --shadow-rest:0 1px 2px rgba(0,0,0,.35);
  --shadow-lift:0 22px 45px -12px rgba(0,0,0,.75), 0 0 0 1px var(--accent-ring);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f8fa; --bg-soft:#eef1f5; --panel:#fff;
    --card:#fff; --card-hi:#f3f6fa;
    --bundle:#eef3fc; --bundle-edge:#c5d6f2;
    --border:#d8dee4; --border-hi:#b9c2cc;
    --text:#1f2328; --muted:#5b6570; --faint:#8c959f;
    --accent:#0969da; --accent-soft:rgba(9,105,218,.1); --accent-ring:rgba(9,105,218,.5);
    --shadow-rest:0 1px 2px rgba(27,31,36,.08);
    --shadow-lift:0 22px 45px -12px rgba(27,31,36,.35), 0 0 0 1px var(--accent-ring);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
body.is-dragging{cursor:grabbing; user-select:none; -webkit-user-select:none}

/* ---------- chrome ---------- */
header.top{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:14px 20px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto}
.brand h1{font-size:16px; margin:0; letter-spacing:-.2px}
.brand span{font-size:12px; color:var(--faint)}
.btn{
  appearance:none; border:1px solid var(--border-hi); background:var(--panel); color:var(--text);
  padding:7px 13px; border-radius:9px; font-size:13px; font-weight:500; cursor:pointer;
  transition:background .15s var(--ease), border-color .15s var(--ease), transform .12s var(--spring);
}
.btn:hover{background:var(--card-hi); border-color:var(--accent)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent}
.hint{
  padding:10px 20px; font-size:12.5px; color:var(--muted);
  border-bottom:1px solid var(--border); background:var(--bg-soft);
}
.hint b{color:var(--text); font-weight:600}

/* ---------- board ---------- */
#board{
  display:flex; flex-wrap:wrap; align-items:flex-start;
  gap:16px; padding:22px 20px 120px;
}
@media (max-width:520px){
  .card, .card.in-bundle{width:100%}
  .bundle{width:100%}
  header.top{padding:12px 14px}
  #board{padding:16px 14px 100px}
}
.empty{
  width:100%; padding:70px 20px; text-align:center; color:var(--muted);
}
.empty h2{margin:0 0 6px; font-size:17px; color:var(--text)}
.empty p{margin:0 0 18px}

/* ---------- card ---------- */
.card{
  position:relative; width:212px; max-width:100%; flex:0 0 auto;
  background:var(--card); border:1px solid var(--border); border-radius:var(--r);
  padding:13px 14px 14px; box-shadow:var(--shadow-rest);
  cursor:grab; touch-action:none;
  transition:background .16s var(--ease), border-color .16s var(--ease), box-shadow .16s var(--ease);
}
.card:hover{background:var(--card-hi); border-color:var(--border-hi)}
.card-top{display:flex; align-items:flex-start; gap:8px}
.card-title{
  margin:0; font-size:14.5px; font-weight:600; letter-spacing:-.15px;
  flex:1; min-width:0; overflow-wrap:anywhere;
}
.card-desc{margin:7px 0 0; font-size:12.5px; color:var(--muted); overflow-wrap:anywhere; white-space:pre-wrap}
.card-desc.empty{font-style:italic; color:var(--faint)}
.card-tools{display:flex; gap:2px; opacity:0; transition:opacity .15s var(--ease)}
.card:hover .card-tools, .card:focus-within .card-tools{opacity:1}
.icon{
  appearance:none; background:transparent; border:0; color:var(--muted);
  width:23px; height:23px; border-radius:6px; cursor:pointer; font-size:12px; line-height:1;
  display:grid; place-items:center; padding:0;
  transition:background .13s var(--ease), color .13s var(--ease), transform .13s var(--spring);
}
.icon:hover{background:var(--accent-soft); color:var(--accent)}
.icon:active{transform:scale(.88)}
.icon.danger:hover{background:rgba(248,81,73,.15); color:var(--danger)}

/* ---------- bundle ---------- */
.bundle{
  flex:0 0 auto; max-width:100%; min-width:0; position:relative;
  background:var(--bundle); border:1px solid var(--bundle-edge); border-radius:var(--r-lg);
  padding:10px; display:flex; flex-direction:column; gap:10px;
  box-shadow:var(--shadow-rest);
  transition:border-color .16s var(--ease), box-shadow .16s var(--ease);
}
.bundle::before{
  content:''; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none;
  background:linear-gradient(145deg, rgba(88,166,255,.09), transparent 58%);
}
.bundle-head{
  display:flex; align-items:center; gap:7px; padding:2px 4px 0;
  cursor:grab; touch-action:none;
}
.bundle-name{font-size:13px; font-weight:700; letter-spacing:.3px; overflow-wrap:anywhere}
.count{font-size:11px; color:var(--faint); white-space:nowrap}
.count::before{content:'· '}
.spacer{flex:1}
.chev{transition:transform .25s var(--spring)}
.bundle.collapsed .chev{transform:rotate(-90deg)}
.bundle-body{display:flex; flex-wrap:wrap; gap:10px; max-width:min(684px,100%); min-width:0}
.card.in-bundle{width:198px; max-width:100%; background:var(--card); border-color:var(--border)}
.peek{display:flex; flex-direction:column; gap:5px; padding:2px 4px 4px; width:190px}
.peek-bar{height:8px; border-radius:4px; background:var(--card); border:1px solid var(--border)}
.peek-bar:nth-child(2){width:86%; opacity:.8}
.peek-bar:nth-child(3){width:72%; opacity:.6}
.peek-bar:nth-child(4){width:58%; opacity:.4}

/* ---------- drag states ---------- */
.card.dragging, .bundle.dragging{
  box-shadow:var(--shadow-lift);
  cursor:grabbing; z-index:999;
  transition:none;
}
.placeholder{
  border:1.5px dashed var(--border-hi); border-radius:var(--r);
  background:var(--accent-soft); opacity:.5;
  animation:ph .22s var(--ease);
}
@keyframes ph{from{opacity:0; transform:scale(.94)} to{opacity:.5; transform:none}}

.drop-target{
  border-color:var(--accent)!important;
  box-shadow:0 0 0 2px var(--accent-ring), 0 10px 30px -10px rgba(0,0,0,.6)!important;
  animation:pulse 1.1s var(--ease) infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 2px var(--accent-ring), 0 10px 30px -10px rgba(0,0,0,.6)}
  50%{box-shadow:0 0 0 5px var(--accent-soft), 0 10px 30px -10px rgba(0,0,0,.6)}
}
.drop-label{
  position:fixed; z-index:1000; pointer-events:none;
  background:var(--accent); color:#fff; font-size:11.5px; font-weight:600;
  padding:4px 9px; border-radius:7px; white-space:nowrap;
  box-shadow:0 6px 16px rgba(0,0,0,.4);
  animation:labelIn .16s var(--spring);
}
@keyframes labelIn{from{opacity:0; transform:translateY(5px) scale(.9)} to{opacity:1; transform:none}}

/* ---------- modal ---------- */
.backdrop{
  position:fixed; inset:0; z-index:200; display:grid; place-items:center;
  background:rgba(0,0,0,.55); backdrop-filter:blur(3px);
  animation:fade .16s var(--ease);
}
@keyframes fade{from{opacity:0} to{opacity:1}}
.modal{
  width:min(420px, calc(100vw - 40px));
  background:var(--panel); border:1px solid var(--border-hi); border-radius:16px;
  padding:20px; display:flex; flex-direction:column; gap:14px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.8);
  animation:modalIn .24s var(--spring);
}
@keyframes modalIn{from{opacity:0; transform:translateY(14px) scale(.96)} to{opacity:1; transform:none}}
.modal h2{margin:0; font-size:15px}
.modal label{display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted); font-weight:600}
.modal input, .modal textarea{
  font:inherit; color:var(--text); background:var(--bg-soft);
  border:1px solid var(--border-hi); border-radius:9px; padding:9px 11px; width:100%;
  resize:vertical;
}
.modal input:focus, .modal textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:2px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important; transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><h1>Yaiku Cards</h1><span>drag · drop · bundle</span></div>
  <button class="btn primary" id="newBtn">+ New card</button>
  <button class="btn" id="exportBtn">Export</button>
  <button class="btn" id="importBtn">Import</button>
  <button class="btn ghost" id="resetBtn">Reset</button>
  <input type="file" id="fileIn" accept="application/json" hidden>
</header>

<div class="hint">
  Drag a card <b>onto another card</b> to bundle them. Drag onto an existing bundle to join it.
  Drag a card <b>out to empty space</b> to free it. Bundles with one card left dissolve on their own.
</div>

<main id="board"></main>

<div class="backdrop" id="modal" hidden>
  <form class="modal" id="cardForm">
    <h2 id="modalTitle">New card</h2>
    <label>Title<input id="fTitle" maxlength="60" autocomplete="off" required></label>
    <label>Description<textarea id="fDesc" rows="3" maxlength="400"></textarea></label>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="mCancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</div>

<script>
(function(){
'use strict';

const KEY='yaiku-cards-v1';
const SPRING='cubic-bezier(.34,1.4,.64,1)';
const board=document.getElementById('board');
const modal=document.getElementById('modal');
const cardForm=document.getElementById('cardForm');
const fTitle=document.getElementById('fTitle');
const fDesc=document.getElementById('fDesc');
const modalTitle=document.getElementById('modalTitle');
const fileIn=document.getElementById('fileIn');

const uid=p=>p+Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------- state ---------------- */
function seed(){
  return {items:[
    {id:uid('c'),kind:'card',title:'A',desc:'Drag me onto card B.'},
    {id:uid('c'),kind:'card',title:'B',desc:'We will become a bundle.'},
    {id:uid('c'),kind:'card',title:'C',desc:'I am happy on my own.'}
  ]};
}
function load(){
  try{const raw=localStorage.getItem(KEY); if(!raw) return null;
    const s=JSON.parse(raw); return (s&&Array.isArray(s.items))?s:null;
  }catch(e){return null;}
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }
let state=load()||seed();

function findLocation(id){
  for(let i=0;i<state.items.length;i++){
    const it=state.items[i];
    if(it.id===id) return {top:true,index:i,item:it};
    if(it.kind==='bundle'){
      const j=it.children.findIndex(c=>c.id===id);
      if(j>=0) return {top:false,index:j,item:it.children[j],bundle:it};
    }
  }
  return null;
}
function autoName(b){
  if(b.renamed) return;
  b.name=b.children.map(c=>(c.title||'?').trim().charAt(0).toUpperCase()).join('')||'Bundle';
}
function dissolveIfThin(b){
  if(b.children.length>1) return;
  const i=state.items.indexOf(b);
  if(i>=0) state.items.splice(i,1,...b.children);
}
function detach(id){
  const loc=findLocation(id);
  if(!loc) return null;
  if(loc.top) return state.items.splice(loc.index,1)[0];
  const card=loc.bundle.children.splice(loc.index,1)[0];
  autoName(loc.bundle);
  dissolveIfThin(loc.bundle);
  return card;
}

/* ---------------- render ---------------- */
function cardEl(c,inBundle){
  const el=document.createElement('article');
  el.className='card'+(inBundle?' in-bundle':'');
  el.dataset.id=c.id; el.dataset.drag=c.id; el.dataset.kind='card';
  const top=document.createElement('div'); top.className='card-top';
  const h=document.createElement('h3'); h.className='card-title'; h.textContent=c.title;
  const tools=document.createElement('div'); tools.className='card-tools';
  tools.appendChild(mkIcon('edit',c.id,'✎','Edit'));
  tools.appendChild(mkIcon('del',c.id,'✕','Delete',true));
  top.append(h,tools); el.appendChild(top);
  const p=document.createElement('p'); p.className='card-desc';
  if(c.desc){p.textContent=c.desc;} else {p.textContent='No description'; p.classList.add('empty');}
  el.appendChild(p);
  return el;
}
function mkIcon(act,id,glyph,label,danger){
  const b=document.createElement('button');
  b.type='button'; b.className='icon'+(danger?' danger':'');
  b.dataset.act=act; b.dataset.id=id; b.textContent=glyph; b.title=label;
  b.setAttribute('aria-label',label);
  return b;
}
function bundleEl(b){
  const el=document.createElement('section');
  el.className='bundle'+(b.collapsed?' collapsed':'');
  el.dataset.id=b.id; el.dataset.kind='bundle';
  const head=document.createElement('header');
  head.className='bundle-head'; head.dataset.drag=b.id;
  const chev=mkIcon('toggle',b.id,'▾',b.collapsed?'Expand':'Collapse'); chev.classList.add('chev');
  const name=document.createElement('span'); name.className='bundle-name'; name.textContent=b.name||'Bundle';
  const count=document.createElement('span'); count.className='count'; count.textContent=b.children.length+' cards';
  const sp=document.createElement('span'); sp.className='spacer';
  head.append(chev,name,count,sp,
    mkIcon('rename',b.id,'✎','Rename bundle'),
    mkIcon('unpack',b.id,'⇱','Unpack bundle'));
  el.appendChild(head);
  const body=document.createElement('div'); body.className='bundle-body';
  if(b.collapsed){
    const peek=document.createElement('div'); peek.className='peek';
    b.children.slice(0,4).forEach(()=>{const s=document.createElement('span'); s.className='peek-bar'; peek.appendChild(s);});
    body.appendChild(peek);
  }else{
    b.children.forEach(c=>body.appendChild(cardEl(c,true)));
  }
  el.appendChild(body);
  return el;
}
function emptyEl(){
  const d=document.createElement('div'); d.className='empty';
  const h=document.createElement('h2'); h.textContent='Nothing here yet';
  const p=document.createElement('p'); p.textContent='Make a few cards, then drag one onto another.';
  const b=document.createElement('button'); b.className='btn primary'; b.textContent='+ New card';
  b.addEventListener('click',()=>openModal(null));
  d.append(h,p,b); return d;
}
function render(animate){
  const first=animate?capture():null;
  board.textContent='';
  if(!state.items.length){ board.appendChild(emptyEl()); }
  else state.items.forEach(it=>board.appendChild(it.kind==='bundle'?bundleEl(it):cardEl(it,false)));
  save();
  if(animate) flip(first);
}

/* ---------------- FLIP ---------------- */
function capture(){
  const m=new Map();
  board.querySelectorAll('[data-id]').forEach(el=>m.set(el.dataset.id,el.getBoundingClientRect()));
  return m;
}
function flip(first){
  if(!first) return;
  board.querySelectorAll('[data-id]').forEach(el=>{
    const prev=first.get(el.dataset.id);
    if(!prev){
      el.animate([{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'none'}],
                 {duration:280,easing:SPRING});
      return;
    }
    const now=el.getBoundingClientRect();
    const dx=prev.left-now.left, dy=prev.top-now.top;
    if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5) return;
    el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],
               {duration:400,easing:SPRING});
  });
}

/* ---------------- drag engine ---------------- */
let pending=null, drag=null, labelEl=null;

board.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  if(e.target.closest('button,input,textarea')) return;
  const handle=e.target.closest('[data-drag]');
  if(!handle) return;
  const id=handle.dataset.drag;
  const el=board.querySelector('[data-id="'+CSS.escape(id)+'"]');
  if(!el) return;
  pending={id:id,el:el,x:e.clientX,y:e.clientY};
  window.addEventListener('pointermove',onMove,{passive:false});
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);
});

function onMove(e){
  if(pending&&!drag){
    if(Math.hypot(e.clientX-pending.x,e.clientY-pending.y)<5) return;
    begin();
  }
  if(!drag) return;
  e.preventDefault();
  const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  drag.vx=drag.vx*0.78+(e.clientX-drag.lastX)*0.22;
  drag.lastX=e.clientX;
  const tilt=clamp(drag.vx*0.8,-9,9);
  drag.el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.05) rotate('+tilt+'deg)';
  evaluate(e.clientX,e.clientY);
}

function begin(){
  const el=pending.el, r=el.getBoundingClientRect();
  const ph=document.createElement('div');
  ph.className='placeholder';
  ph.style.width=r.width+'px'; ph.style.height=r.height+'px';
  el.parentNode.insertBefore(ph,el);
  el.style.position='fixed';
  el.style.left=r.left+'px'; el.style.top=r.top+'px';
  el.style.width=r.width+'px'; el.style.margin='0';
  el.style.zIndex='999'; el.style.pointerEvents='none';
  el.classList.add('dragging');
  document.body.classList.add('is-dragging');
  drag={id:pending.id,el:el,ph:ph,x0:pending.x,y0:pending.y,lastX:pending.x,vx:0,action:null,targetId:null};
}

function clearHighlight(){
  board.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
  if(labelEl){labelEl.remove(); labelEl=null;}
}

function evaluate(x,y){
  clearHighlight();
  const me=findLocation(drag.id);
  if(!me){drag.action=null; return;}
  const under=document.elementFromPoint(x,y);
  let action=null, targetEl=null, text='';
  if(under){
    const overCard=under.closest('.card[data-id]');
    const overBundle=under.closest('.bundle[data-id]');
    const myBundleId=me.top?null:me.bundle.id;

    if(overBundle&&overBundle.dataset.id===drag.id){
      action=null;
    }else if(overBundle&&overBundle.dataset.id===myBundleId){
      action='noop';
    }else if(overBundle){
      targetEl=overBundle;
      const t=findLocation(overBundle.dataset.id);
      if(me.item.kind==='bundle'){ action='mergeBundles'; text='Merge into '+(t?t.item.name:'bundle'); }
      else { action='join'; text='Add to '+(t?t.item.name:'bundle'); }
    }else if(overCard&&overCard.dataset.id!==drag.id){
      targetEl=overCard;
      const t=findLocation(overCard.dataset.id);
      if(me.item.kind==='bundle'){ action='absorb'; text='Pull '+(t?t.item.title:'card')+' in'; }
      else { action='merge'; text='Bundle with '+(t?t.item.title:'card'); }
    }else{
      action='move';
    }
  }else{
    action='move';
  }
  if(targetEl){
    targetEl.classList.add('drop-target');
    labelEl=document.createElement('div');
    labelEl.className='drop-label';
    labelEl.textContent=text;
    labelEl.style.left=(x+16)+'px';
    labelEl.style.top=(y+18)+'px';
    document.body.appendChild(labelEl);
  }
  drag.action=action;
  drag.targetId=targetEl?targetEl.dataset.id:null;
}

function insertionIndex(x,y){
  const els=Array.prototype.filter.call(
    board.children, el=>el.dataset&&el.dataset.id&&el.dataset.id!==drag.id);
  for(let i=0;i<els.length;i++){
    const r=els[i].getBoundingClientRect();
    if(y<r.bottom&&x<r.left+r.width/2) return i;
  }
  return els.length;
}

function applyDrop(x,y){
  const a=drag.action;
  if(!a||a==='noop') return;

  if(a==='merge'){
    const moving=detach(drag.id); if(!moving) return;
    const t=findLocation(drag.targetId);
    if(!t||!t.top){ state.items.push(moving); return; }
    const b={id:uid('b'),kind:'bundle',name:'',collapsed:false,renamed:false,children:[t.item,moving]};
    state.items.splice(t.index,1,b);
    autoName(b);
    return;
  }
  if(a==='join'){
    const moving=detach(drag.id); if(!moving) return;
    const t=findLocation(drag.targetId);
    if(!t||t.item.kind!=='bundle'){ state.items.push(moving); return; }
    t.item.children.push(moving); autoName(t.item);
    return;
  }
  if(a==='absorb'){
    const t=findLocation(drag.targetId);
    const me=findLocation(drag.id);
    if(!t||!t.top||!me||me.item.kind!=='bundle') return;
    const card=state.items.splice(t.index,1)[0];
    me.item.children.push(card); autoName(me.item);
    return;
  }
  if(a==='mergeBundles'){
    const src=findLocation(drag.id), dst=findLocation(drag.targetId);
    if(!src||!dst||dst.item.kind!=='bundle') return;
    dst.item.children.push.apply(dst.item.children,src.item.children);
    autoName(dst.item);
    const i=state.items.indexOf(src.item);
    if(i>=0) state.items.splice(i,1);
    return;
  }
  // move / reorder on the board
  const idx=insertionIndex(x,y);
  const moving=detach(drag.id); if(!moving) return;
  state.items.splice(Math.min(idx,state.items.length),0,moving);
}

function teardown(){
  if(!drag) return;
  drag.ph.remove();
  drag.el.classList.remove('dragging');
  drag.el.removeAttribute('style');
  document.body.classList.remove('is-dragging');
  clearHighlight();
}

function onUp(e){
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onUp);
  if(!drag){ pending=null; return; }
  const first=capture();
  const x=e.clientX, y=e.clientY;
  teardown();
  applyDrop(x,y);
  drag=null; pending=null;
  render(false);
  flip(first);
}

window.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(drag){
    window.removeEventListener('pointermove',onMove);
    window.removeEventListener('pointerup',onUp);
    window.removeEventListener('pointercancel',onUp);
    const first=capture();
    teardown(); drag=null; pending=null;
    render(false); flip(first);
  }else if(!modal.hidden){ modal.hidden=true; }
});

/* ---------------- actions ---------------- */
board.addEventListener('click',e=>{
  const btn=e.target.closest('button[data-act]');
  if(!btn) return;
  const id=btn.dataset.id, act=btn.dataset.act;
  if(act==='edit'){ openModal(id); return; }
  if(act==='del'){ const f=capture(); detach(id); render(false); flip(f); return; }
  if(act==='toggle'){
    const l=findLocation(id); if(!l) return;
    const f=capture(); l.item.collapsed=!l.item.collapsed; render(false); flip(f); return;
  }
  if(act==='rename'){
    const l=findLocation(id); if(!l) return;
    const n=prompt('Bundle name',l.item.name||'');
    if(n===null) return;
    const t=n.trim();
    if(t){ l.item.name=t; l.item.renamed=true; } else { l.item.renamed=false; autoName(l.item); }
    render(false); return;
  }
  if(act==='unpack'){
    const l=findLocation(id); if(!l||l.item.kind!=='bundle') return;
    const f=capture();
    const i=state.items.indexOf(l.item);
    if(i>=0) state.items.splice(i,1,...l.item.children);
    render(false); flip(f); return;
  }
});

let editingId=null;
function openModal(id){
  editingId=id||null;
  const loc=id?findLocation(id):null;
  const c=loc?loc.item:null;
  modalTitle.textContent=c?'Edit card':'New card';
  fTitle.value=c?c.title:'';
  fDesc.value=c&&c.desc?c.desc:'';
  modal.hidden=false;
  setTimeout(()=>fTitle.focus(),30);
}
cardForm.addEventListener('submit',e=>{
  e.preventDefault();
  const t=fTitle.value.trim();
  if(!t) return;
  const d=fDesc.value.trim();
  if(editingId){
    const loc=findLocation(editingId);
    if(loc){ loc.item.title=t; loc.item.desc=d; if(!loc.top) autoName(loc.bundle); }
  }else{
    state.items.push({id:uid('c'),kind:'card',title:t,desc:d});
  }
  modal.hidden=true;
  render(true);
});
document.getElementById('mCancel').addEventListener('click',()=>{modal.hidden=true;});
modal.addEventListener('pointerdown',e=>{ if(e.target===modal) modal.hidden=true; });
document.getElementById('newBtn').addEventListener('click',()=>openModal(null));

document.getElementById('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='yaiku-cards-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
});
document.getElementById('importBtn').addEventListener('click',()=>fileIn.click());
fileIn.addEventListener('change',()=>{
  const f=fileIn.files&&fileIn.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(String(r.result));
      if(!s||!Array.isArray(s.items)) throw new Error('bad file');
      state=s; render(true);
    }catch(err){ alert('That file could not be read as a Yaiku Cards export.'); }
    fileIn.value='';
  };
  r.readAsText(f);
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm('Clear the board and start over? Export first if you want a copy.')) return;
  state=seed(); render(true);
});

render(false);
})();
</script>
</body>
</html>
